<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Sports Math All-Stars</title>
<meta name="description" content="A K-6 sports math game: boogie boarding, surfing, Dodgers baseball, Mammoth Mountain skiing and USC Trojans football.">
<meta name="theme-color" content="#005A9C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math All-Stars">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23005A9C'/%3E%3Cpath d='M50 12l10.6 23.4 25.4 2.6-19 17.2 5.4 25L50 67.4 27.6 80.2l5.4-25-19-17.2 25.4-2.6z' fill='%23FFCC00' stroke='%23990000' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="appleIcon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23005A9C'/%3E%3C/svg%3E">
<link rel="manifest" id="manifestLink" href="data:application/manifest+json,%7B%22name%22%3A%22Sports%20Math%20All-Stars%22%2C%22short_name%22%3A%22Math%20All-Stars%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22any%22%2C%22background_color%22%3A%22%23005A9C%22%2C%22theme_color%22%3A%22%23005A9C%22%7D">
<style>
:root{
  --cardinal:#990000; --gold:#FFCC00; --dodger:#005A9C;
  --ink:#1d2a44; --good:#1FAF5A; --bad:#FF7A45;
  --font:"Arial Rounded MT Bold","Nunito","Varela Round","Quicksand",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b4f8a;overscroll-behavior:none}
body{font-family:var(--font);font-size:22px;font-weight:700;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-weight:800;touch-action:manipulation;cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;height:100%;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px)}
.screen.active{display:flex}
.round-btn{width:68px;height:68px;min-width:68px;border-radius:50%;background:#fff;font-size:32px;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.15);transition:transform .08s}
.round-btn:active{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.18)}

/* ---------- HOME ---------- */
#home{background:
  radial-gradient(circle at 12% 10%,rgba(255,255,255,.35) 0 60px,transparent 61px),
  radial-gradient(circle at 88% 18%,rgba(255,255,255,.18) 0 90px,transparent 91px),
  linear-gradient(180deg,#38B6FF 0%,#1E90E8 45%,#0A5FB0 100%)}
.home-head{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.logo{width:84px;height:84px;flex:0 0 auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.titles{flex:1;min-width:0}
.title{margin:0;font-size:clamp(34px,5.2vw,62px);line-height:1;font-weight:900;color:#fff;letter-spacing:.5px;
  text-shadow:0 4px 0 var(--cardinal),0 7px 0 rgba(0,0,0,.25)}
.title .gold{color:var(--gold)}
.subtitle{margin-top:8px;color:#fff;font-size:clamp(20px,2.4vw,26px);opacity:.95;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.head-btns{display:flex;gap:12px}
.grid{flex:1;min-height:0;margin-top:14px;display:grid;gap:16px;
  grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;overflow-y:auto;padding:4px 4px 10px;-webkit-overflow-scrolling:touch}
@media (orientation:portrait){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .grid{grid-template-columns:1fr;grid-auto-rows:minmax(220px,auto)} }
.card{position:relative;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:#fff;text-align:left;padding:0;min-height:200px;
  box-shadow:0 7px 0 rgba(0,0,0,.2),0 12px 24px rgba(0,0,0,.18);transition:transform .1s;border:4px solid #fff}
.card:active{transform:translateY(4px) scale(.98);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.card .thumb{flex:1 1 55%;min-height:90px;position:relative;overflow:hidden;background:#9fd8ff}
.card .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.card .info{flex:0 0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:3px}
.pill{position:absolute;top:10px;left:10px;z-index:2;padding:6px 14px;border-radius:999px;font-size:21px;font-weight:900;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);border:2px solid #fff}
.card .wname{font-size:clamp(20px,2.1vw,25px);line-height:1.1;font-weight:900}
.card .sport{font-size:18px;opacity:.75;font-weight:800}
.stars{font-size:28px;letter-spacing:2px;line-height:1}
.stars .on{color:#FFB800;text-shadow:0 2px 0 #c77f00}
.stars .off{color:#d6dde8}
.card.player{background:linear-gradient(160deg,var(--cardinal),#5e0000);color:#fff;align-items:center;justify-content:center;text-align:center;gap:6px;padding:14px;border-color:var(--gold)}
.card.player .big{font-size:54px;line-height:1}
.card.player .pname{font-size:26px;color:var(--gold)}
.card.player small{font-size:19px;opacity:.9}
.foot-note{flex:0 0 auto;text-align:center;color:#eaf6ff;font-size:18px;margin-top:4px}

/* ---------- GAME ---------- */
#game{background:linear-gradient(180deg,#dff3ff,#bfe6ff);gap:10px}
.topbar{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.gtitle{flex:1;min-width:0;line-height:1.1}
.gtitle .w{font-size:clamp(22px,2.6vw,30px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle .g{font-size:18px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.dot{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.12);border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.dot.cur{background:#fff;transform:scale(1.2);box-shadow:0 0 0 3px var(--accent,#005A9C)}
.dot.ok{background:var(--good)} .dot.miss{background:var(--bad)}
.scene-wrap{position:relative;flex:0 0 auto;height:clamp(110px,min(26vh,calc((100vw - 28px) / 5)),240px);border-radius:24px;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.15);border:4px solid rgba(255,255,255,.85);background:#7FD3FF}
.scene-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;
  font-size:clamp(28px,4.4vw,52px);font-weight:900;color:#fff;white-space:nowrap;
  text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 18px rgba(0,0,0,.45)}
.toast.show{animation:toast 1.25s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.scene-label{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.5);color:#fff;border-radius:14px;padding:4px 12px;font-size:18px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{flex:1;min-height:0;display:flex;gap:14px}
@media (orientation:portrait){ .play{flex-direction:column} }
.qcard{flex:1.25;min-height:0;min-width:0;background:#fff;border-radius:26px;padding:40px 20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.08);overflow:hidden;position:relative}
.qcard .qtag{position:absolute;top:10px;left:14px;font-size:17px;color:#fff;background:var(--accent,#005A9C);border-radius:12px;padding:3px 12px}
.prompt{font-size:clamp(24px,4.2vmin,40px);line-height:1.25;text-align:center;font-weight:900;max-width:100%}
.prompt.long{font-size:clamp(22px,3.4vmin,32px)}
.prompt.big{font-size:clamp(34px,6.6vmin,60px)}
.qcard::after{content:attr(data-icon);position:absolute;right:-10px;bottom:-24px;font-size:150px;opacity:.07;pointer-events:none;transform:rotate(-12deg)}
.qcard>*{position:relative;z-index:1}
.qcard .qtag{position:absolute}
.prompt .eq{font-size:1.35em;white-space:nowrap}
.visual{display:flex;align-items:center;justify-content:center;max-width:100%;min-height:0}
.visual:empty{display:none}
.answers{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px}
.answers.three,.answers.two{grid-template-columns:1fr}
.answers.three .ans{font-size:clamp(44px,8vmin,72px)}
@media (orientation:portrait){ .answers.three{grid-template-columns:repeat(3,1fr)} .answers.two{grid-template-columns:1fr 1fr} }
@media (orientation:portrait){ .answers{flex:0 0 auto;height:clamp(200px,28vh,300px)} }
.ans{min-height:72px;border-radius:24px;background:#fff;font-size:clamp(30px,5vmin,50px);font-weight:900;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:8px 10px;text-align:center;line-height:1.1;
  box-shadow:0 7px 0 var(--accent-dark,#003f6e),0 10px 18px rgba(0,0,0,.12);border:4px solid var(--accent,#005A9C);transition:transform .08s,background .15s}
.ans:active{transform:translateY(4px);box-shadow:0 3px 0 var(--accent-dark,#003f6e)}
.ans.small{font-size:clamp(22px,3.4vmin,34px)}
.ans.right{background:var(--good);color:#fff;border-color:#118a43;box-shadow:0 7px 0 #0c6b33;animation:pop .45s}
.ans.wrong{background:#ffe1d3;border-color:var(--bad);color:#b3401a;box-shadow:0 7px 0 #d0551f;animation:shake .45s}
.ans.dim{opacity:.45}
.ans:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(6px)}}
.unit{font-size:.55em;margin-left:.25em;opacity:.8;font-weight:800}

/* fractions & math bits */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.05;font-size:.92em}
.frac>span{padding:0 .18em}
.frac>span:last-child{border-top:.09em solid currentColor}
.mixed{display:inline-flex;align-items:center;white-space:nowrap}
.mixed .frac{margin-left:.08em}
.blank{display:inline-block;min-width:1.4em;padding:0 .2em;border-radius:.3em;background:#fff3b0;border:3px dashed #e0a800;color:#b07d00;text-align:center}
.hl{color:#fff;background:var(--cardinal);border-radius:.2em;padding:0 .1em}
sup{font-size:.6em}
.emo-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.emo-row{display:flex;gap:4px}
.em{font-size:var(--es,44px);line-height:1.1;display:inline-block;position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.em.gone{opacity:.3;filter:grayscale(1)}
.em.gone::after{content:"";position:absolute;left:-4%;right:-4%;top:48%;height:.1em;background:#e53935;transform:rotate(-35deg);border-radius:4px}
.cmp{display:flex;gap:18px}
.grp{border:4px solid #7cc7ff;border-radius:20px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f2faff}
.grp.b{border-color:#ffbe5c;background:#fff8ec}
.grp b{font-size:28px}
.plus{font-size:44px;font-weight:900;padding:0 8px}
.addrow{display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
.blocks{display:flex;gap:6px;align-items:flex-end}
.rod{display:grid;grid-template-rows:repeat(10,13px);gap:2px;padding:3px;background:#0b77c9;border-radius:6px}
.rod i,.ones i{display:block;width:17px;height:13px;background:#8fd0ff;border-radius:3px}
.ones{display:grid;grid-template-columns:repeat(2,17px);gap:4px;margin-left:10px}
.ones i{background:#ffcc00;outline:2px solid #c99a00;height:15px}
.coins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;max-width:560px}
.coin{border-radius:50%;display:grid;place-items:center;font-weight:900;color:#3a3a3a;font-size:20px;
  background:radial-gradient(circle at 35% 30%,#fff,#cfd6de 45%,#9aa4ae);box-shadow:inset 0 0 0 4px #aab3bc,0 4px 0 rgba(0,0,0,.2)}
.coin.q{width:86px;height:86px;font-size:24px}.coin.n{width:74px;height:74px}.coin.d{width:60px;height:60px;font-size:18px}
.coin.p{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#ffd7b0,#d98b4e 50%,#a95a24);box-shadow:inset 0 0 0 4px #b86a33,0 4px 0 rgba(0,0,0,.2);color:#4a2308}
.clock{width:clamp(150px,22vh,210px);height:auto}
.fracfig{width:clamp(140px,20vh,200px);height:auto}
.fracbar{width:clamp(240px,34vw,360px);height:auto}
.figsvg{max-height:clamp(150px,24vh,240px);width:auto;max-width:100%}
.ldiv{display:inline-flex;align-items:flex-start;font-size:clamp(40px,5vw,60px);font-weight:900}
.ldiv .dvs{padding:.08em .15em .08em 0}
.ldiv .dvd{border-top:.09em solid currentColor;border-left:.09em solid currentColor;border-top-left-radius:.35em;padding:.08em .25em 0 .3em}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{min-width:74px;padding:10px 12px 8px;border-radius:16px 16px 22px 22px;background:var(--cardinal);color:var(--gold);font-size:32px;text-align:center;box-shadow:0 4px 0 #5e0000}
.chip small{display:block;font-size:14px;color:#fff;opacity:.85}
.bignum{font-size:clamp(40px,6vw,64px);letter-spacing:2px;font-weight:900}

/* feedback sheet (slides down from the top so the answer buttons stay visible) */
.sheet{position:absolute;left:calc(var(--sl) + 14px);right:calc(var(--sr) + 14px);top:calc(var(--st) + 10px);z-index:20;
  background:#fffdf3;border-radius:28px;padding:18px 22px;display:flex;gap:18px;align-items:center;
  box-shadow:0 12px 40px rgba(0,0,0,.35);border:5px solid #ffcc00;transform:translateY(calc(-100% - 40px));transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.sheet.show{transform:none}
.sheet .coach{font-size:64px;line-height:1}
.sheet .txt{flex:1;min-width:0}
.sheet .h{font-size:clamp(26px,3vw,34px);font-weight:900;color:#c25400}
.sheet .a{font-size:clamp(24px,2.8vw,32px);margin:4px 0}
.sheet .a b{color:var(--good);font-size:1.2em}
.sheet .hint{font-size:clamp(19px,2.1vw,23px);font-weight:700;opacity:.85;line-height:1.35}
.bigbtn{min-height:76px;min-width:160px;padding:0 28px;border-radius:24px;font-size:30px;color:#fff;background:var(--good);box-shadow:0 7px 0 #0c6b33;transition:transform .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #0c6b33}
.bigbtn.blue{background:var(--dodger);box-shadow:0 7px 0 #003a66}
.bigbtn.red{background:var(--cardinal);box-shadow:0 7px 0 #5c0000}
.bigbtn.gray{background:#8795a8;box-shadow:0 7px 0 #5d6a7c}
@media (orientation:portrait){ .sheet{flex-wrap:wrap} .sheet .bigbtn{width:100%} }
@media (max-height:700px){ .sheet .coach{display:none} }

/* overlays */
.overlay{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(6,22,48,.55);
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:32px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;animation:rise .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(60px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal .mhead{padding:22px 20px 18px;color:#fff;position:relative;overflow:hidden}
.modal .mbody{padding:18px 24px 24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.win-title{font-size:clamp(40px,6.5vw,68px);font-weight:900;line-height:1.02;text-shadow:0 5px 0 rgba(0,0,0,.3);animation:bounce 1s ease-in-out infinite alternate}
.win-sub{font-size:24px;margin-top:6px;opacity:.95}
@keyframes bounce{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.06) rotate(2deg)}}
.bigstars{display:flex;gap:10px;justify-content:center}
.bigstars svg{width:clamp(70px,11vw,100px);height:auto;transform:scale(0);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars svg:nth-child(2){animation-delay:.25s;margin-top:-18px}.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{to{transform:scale(1)}}
.score-line{font-size:30px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.field{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.field label{font-size:22px}
.field input{font-size:28px;padding:14px 18px;border-radius:18px;border:4px solid #b9d7f0;outline:none;width:100%;font-weight:800;color:var(--ink)}
.field input:focus{border-color:var(--dodger)}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}
.toggle{min-width:150px;min-height:68px;border-radius:999px;font-size:24px;background:#e3e9f2}
.toggle.on{background:var(--good);color:#fff}
#confetti{position:absolute;inset:0;z-index:45;pointer-events:none;display:none;width:100%;height:100%}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wave-move{animation:wmove 5s ease-in-out infinite alternate}
@keyframes wmove{from{transform:translateX(0)}to{transform:translateX(-24px)}}
.cloud{animation:cloud 30s linear infinite alternate}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){.bob,.wave-move,.cloud,.win-title{animation:none}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active" aria-label="Home">
    <div class="home-head">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="#fff"/>
        <circle cx="50" cy="50" r="41" fill="#005A9C"/>
        <path d="M50 14l10.6 23.4 25.4 2.6-19 17.2 5.4 25L50 69.4 27.6 82.2l5.4-25-19-17.2 25.4-2.6z" fill="#FFCC00" stroke="#990000" stroke-width="4" stroke-linejoin="round"/>
        <text x="50" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#990000" font-family="Arial">+</text>
      </svg>
      <div class="titles">
        <h1 class="title">Sports Math <span class="gold">All-Stars</span></h1>
        <div class="subtitle" id="hello">Pick a grade and hit the field!</div>
      </div>
      <div class="head-btns">
        <button class="round-btn" id="homeSound" aria-label="Sound on or off">🔊</button>
        <button class="round-btn" id="openSettings" aria-label="Settings">⚙️</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot-note">Every grade is open — parents &amp; teachers, pick any level! ⭐ Earn up to 3 stars per world.</div>
  </section>

  <section id="game" class="screen" aria-label="Game">
    <div class="topbar">
      <button class="round-btn" id="goHome" aria-label="Home">🏠</button>
      <div class="gtitle"><div class="w" id="gWorld"></div><div class="g" id="gGrade"></div></div>
      <div class="dots" id="dots"></div>
      <button class="round-btn" id="gameSound" aria-label="Sound on or off">🔊</button>
    </div>
    <div class="scene-wrap" id="sceneWrap"><div id="scene"></div><div class="scene-label" id="sceneLabel"></div><div class="toast" id="toast"></div></div>
    <div class="play">

  confT=requestAnimationFrame(f);
}
function stopConfetti(){cancelAnimationFrame(confT);$('confetti').style.display='none';}
function openSettings(){$('nameIn').value=save.name||'';syncSound();$('resetBtn').textContent='Reset progress';$('setOv').classList.add('show');}
function closeSettings(){save.name=$('nameIn').value.trim().slice(0,14);persist();$('setOv').classList.remove('show');$('nameIn').blur();renderHome();}
let resetArm=null;
$('resetBtn').onclick=()=>{const b=$('resetBtn');if(!resetArm){b.textContent='Tap again to confirm';resetArm=setTimeout(()=>{resetArm=null;b.textContent='Reset progress';},3000);}
  else{clearTimeout(resetArm);resetArm=null;save.stars={};persist();b.textContent='Progress cleared ✓';renderHome();}};
$('openSettings').onclick=()=>{Snd.tap();openSettings();};
$('closeSet').onclick=()=>{Snd.tap();closeSettings();};
$('setOv').addEventListener('click',e=>{if(e.target.id==='setOv')closeSettings();});
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')closeSettings();});
$('sndToggle').onclick=toggleSound;$('homeSound').onclick=toggleSound;$('gameSound').onclick=toggleSound;
$('goHome').onclick=()=>{Snd.tap();if(S){clearTimeout(S.timer);S.locked=true;}$('sheet').classList.remove('show');renderHome();show('home');};
$('nextBtn').onclick=()=>{Snd.tap();proceed();};
$('againBtn').onclick=()=>startLevel(S.g);
$('nextLvlBtn').onclick=()=>startLevel(Math.min(6,S.g+1));
$('winHome').onclick=()=>{stopConfetti();$('winOv').classList.remove('show');renderHome();show('home');};
// iOS: unlock audio on first gesture; block pinch & double-tap zoom and long-press menus
document.addEventListener('pointerdown',()=>{if(save.sound)Snd.ensure();},{passive:true});
document.addEventListener('touchend',()=>{if(save.sound)Snd.ensure();},{passive:true});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now(),inp=e.target.closest&&e.target.closest('input');if(n-lastTouch<320&&!inp){e.preventDefault();if(e.target.closest){const b=e.target.closest('button');if(b)b.click();}}lastTouch=n;},{passive:false});
document.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input')))e.preventDefault();});
// Apple touch icon as PNG (generated at runtime)
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#0B8CFF');g.addColorStop(1,'#005A9C');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.beginPath();for(let i=0;i<10;i++){const r=i%2?30:70,a=-Math.PI/2+i*Math.PI/5;x.lineTo(90+r*Math.cos(a),96+r*Math.sin(a));}x.closePath();x.fillStyle='#FFCC00';x.fill();x.lineWidth=7;x.strokeStyle='#990000';x.lineJoin='round';x.stroke();
  x.fillStyle='#990000';x.font='900 52px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('+',90,100);$('appleIcon').href=c.toDataURL('image/png');}catch(e){}})();
// Test/debug hook
window.SMG={WORLDS,genProblem,startLevel,state:()=>S,
  answerCorrect(){const b=[...document.querySelectorAll('#answers .ans')].find(b=>b.dataset.k===S.problem.answer);if(b)b.click();return !!b;},
  answerWrong(){const b=[...document.querySelectorAll('#answers .ans')].find(b=>b.dataset.k!==S.problem.answer);if(b)b.click();return !!b;},next:()=>proceed()};
renderHome();
</script>
</body>
